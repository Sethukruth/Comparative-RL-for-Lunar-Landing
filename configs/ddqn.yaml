# ── Double DQN Configuration ─────────────────────────────────────────────────
# Autonomous Lunar Lander — Double Deep Q-Network

env:
  name: "LunarLander-v3"
  seed: 42

network:
  hidden_layers: [256, 256, 128]
  activation: "relu"

training:
  episodes: 1000
  max_steps: 1000
  learning_rate: 0.0005
  gamma: 0.99
  batch_size: 128
  target_update_freq: 5

exploration:
  epsilon_start: 1.0
  epsilon_min: 0.01
  epsilon_decay: 0.995

memory:
  capacity: 100000
  min_samples: 1000

checkpoint:
  save_dir: "checkpoints"
  save_every: 50
  best_model_path: "checkpoints/ddqn_best.pth"

logging:
  tensorboard_dir: "tensorboard_logs/ddqn"
  results_dir: "results"
